<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فاتورتي</title>
<meta name="description" content="فواتير وعروض أسعار احترافية للمحلات والأعمال الصغيرة في عُمان">
<meta name="theme-color" content="#1b2f6e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="فاتورتي">
<style>
@font-face{font-family:"FCairo";src:url(fonts/cairo-600.woff) format("woff");font-weight:500 600;font-display:swap}
@font-face{font-family:"FCairo";src:url(fonts/cairo-800.woff) format("woff");font-weight:700 900;font-display:swap}
@font-face{font-family:"FTajawal";src:url(fonts/tajawal-400.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"FTajawal";src:url(fonts/tajawal-500.woff) format("woff");font-weight:500 600;font-display:swap}
@font-face{font-family:"FTajawal";src:url(fonts/tajawal-700.woff) format("woff");font-weight:700 900;font-display:swap}
/* Layout: one-column phone app — onboarding, then tabs (فواتير · عملاء · منتجات · تقارير · المزيد) → editor → preview */
:root{
  --bg:#f3f5fb; --surface:#ffffff; --soft:#eaeef8; --line:#dfe4f0; --fg:#121a33; --muted:#69728f;
  --accent:#1b2f6e; --accent2:#2c4aa8; --gold:#c9a227; --on-accent:#ffffff;
  --ok:#14804a; --warn:#b45309; --late:#c0262d; --q:#6d4bd1;
  --f-display:"FCairo",system-ui,sans-serif; --f-body:"FTajawal",system-ui,sans-serif;
  --shadow:0 6px 24px rgba(20,35,90,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f1f; --surface:#141b31; --soft:#1b2440; --line:#26304f; --fg:#eef1fb; --muted:#9aa3c2;
  --accent:#4d6fe0; --accent2:#3456c4; --gold:#e3bb4a; --on-accent:#ffffff;
  --ok:#3ccb7f; --warn:#f0a24a; --late:#ff6b6b; --q:#a68bff; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f1f; --surface:#141b31; --soft:#1b2440; --line:#26304f; --fg:#eef1fb; --muted:#9aa3c2;
  --accent:#4d6fe0; --accent2:#3456c4; --gold:#e3bb4a; --on-accent:#ffffff;
  --ok:#3ccb7f; --warn:#f0a24a; --late:#ff6b6b; --q:#a68bff; --shadow:none; color-scheme:dark}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{min-height:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;direction:rtl;margin:0;overflow-x:clip}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 40px;min-height:100vh;display:flex;flex-direction:column}
.app.tabbed{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:800}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* onboarding */
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:20px 0 40px;direction:ltr}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:6px;transition:width .35s ease;margin-left:auto}
.ob{flex:1;display:flex;flex-direction:column}
.ob h1{font-size:clamp(26px,7vw,34px);text-align:center}
.ob p.sub{color:var(--muted);text-align:center;margin:10px 0 0;font-weight:500}
.ob .field{margin-top:auto;margin-bottom:auto;display:flex;flex-direction:column;gap:12px}
.big{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:24px;padding:22px;font:600 20px var(--f-body);text-align:center;color:var(--fg)}
.big::placeholder{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 18px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.logo-drop{border:1.5px dashed var(--line);border-radius:24px;padding:28px;text-align:center;color:var(--muted);background:var(--surface)}
.logo-drop img{max-height:90px;border-radius:12px}
.row{display:flex;gap:10px}
.btn{border:0;border-radius:16px;padding:15px 18px;font-weight:700;font-size:16px;background:var(--accent);color:var(--on-accent);flex:1;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.gold{background:var(--gold);color:#1a1405}
.btn.ghost{background:var(--surface);color:var(--fg);border:1.5px solid var(--line)}
.btn.danger{background:var(--late);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.skip{background:none;border:0;color:var(--muted);margin-top:10px;font-weight:500}

/* top bars */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 16px}
.top h2{font-size:22px}
.iconbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 14px;font-weight:700}
.ptitle{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 16px}
.ptitle h1{font-size:28px}
.ptitle small{color:var(--muted);font-weight:500}

/* home hero */
.hero{background:linear-gradient(140deg,#1b2f6e 0%,#2c4aa8 70%,#3557c2 100%);color:#fff;border-radius:26px;padding:18px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(27,47,110,.28);margin-bottom:16px}
.hero::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;border:28px solid rgba(201,162,39,.18);left:-80px;top:-90px}
.hero::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06);left:40px;bottom:-60px}
.hero>*{position:relative}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:46px;height:46px;border-radius:14px;object-fit:cover;background:rgba(255,255,255,.14);display:grid;place-items:center;font:800 20px var(--f-display);color:#f3d77a;flex:0 0 auto}
.avwrap{position:relative;cursor:pointer;flex:0 0 auto}
.avwrap .avatar{display:grid}
.avplus{position:absolute;bottom:-4px;left:-4px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#1a1405;font:800 15px/20px var(--f-display);text-align:center;font-style:normal;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.who small{display:block;opacity:.75;font-size:13px}
.who h2{font-size:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.hstats div{background:rgba(255,255,255,.1);border-radius:16px;padding:11px 13px}
.hstats small{opacity:.8;font-size:13px;font-weight:500}
.hstats b{display:block;font:800 19px var(--f-display);margin-top:2px;color:#f3d77a}
.alert{margin-top:12px;width:100%;border:0;border-radius:14px;padding:11px 14px;background:#fff2f2;color:#a3141b;font-weight:700;text-align:right;display:flex;gap:8px;align-items:center}

/* search + filters */
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font:500 16px var(--f-body);color:var(--fg);margin-bottom:10px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.inv{display:grid;grid-template-columns:42px 1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;text-align:right;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.inv .ic{grid-row:1/3;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font:800 17px var(--f-display);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.inv .ic.q{background:color-mix(in srgb,var(--q) 14%,transparent);color:var(--q)}
.inv .c{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv .m{color:var(--muted);font-size:13px}
.inv .a{font:800 16px var(--f-display);text-align:left}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;justify-self:end}
.pill.paid{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.due{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.late{color:var(--late);background:color-mix(in srgb,var(--late) 14%,transparent)}
.pill.q{color:var(--q);background:color-mix(in srgb,var(--q) 14%,transparent)}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-inline-start:6px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;line-height:1.8}
.empty b{display:block;font:800 18px var(--f-display);color:var(--fg);margin-bottom:4px}
.fab{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0px));margin-top:auto;padding-top:18px;display:flex;gap:10px;z-index:2}
.fab.solo{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.fab .btn{box-shadow:0 10px 24px rgba(27,47,110,.25)}

/* rows (clients, products) */
.rowcard{display:grid;grid-template-columns:42px 1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.rowcard .ic{grid-row:1/3;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:800 17px var(--f-display);background:color-mix(in srgb,var(--gold) 22%,transparent);color:#8a6a10}
.rowcard b{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowcard small{color:var(--muted);font-size:13px}
.rowcard .a{font:800 15px var(--f-display);text-align:left}
.rowcard .due{color:var(--late);font-size:12px;font-weight:700;text-align:left}

/* editor */
.sec{margin-bottom:18px}
.sec h3{font-size:15px;color:var(--muted);font-weight:700;margin-bottom:8px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);font-weight:600}
.in{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 13px;font:500 16px var(--f-body);color:var(--fg);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1.15fr) 30px;gap:8px;align-items:end;margin-bottom:8px}
.item label{display:flex;flex-direction:column;gap:4px;min-width:0}
.item label span{font-size:12px;color:var(--muted);font-weight:700;padding-inline-start:4px}
.item .descl{grid-column:1/-1}
.item .in{background:var(--bg);padding:10px;min-width:0}
.item .amt .in{font-weight:800;color:var(--accent)}
.item .del{border:0;background:none;color:var(--muted);font-size:22px;padding:0 0 10px}
input[type=date].in{-webkit-appearance:none;appearance:none;min-width:0;min-height:48px;text-align:right}
.add{border:1.5px dashed var(--line);background:none;border-radius:16px;padding:12px;width:100%;font-weight:700;color:var(--accent)}
.qchips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.qchip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.qchip small{color:var(--muted);font-weight:500;margin-inline-start:4px}
.totals{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.totals div{display:flex;justify-content:space-between}
.totals .g{font:800 20px var(--f-display);border-top:1px solid var(--line);padding-top:10px;color:var(--accent)}
.totals .g:first-child{border-top:0;padding-top:0}

/* preview + design picker */
.doclabel{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:13px;border-radius:999px;padding:4px 12px;background:color-mix(in srgb,var(--q) 14%,transparent);color:var(--q);margin-bottom:10px}
.design{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.design h3{font-size:15px;color:var(--muted);font-weight:700}
.tpls{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tpl{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700}
.tpl[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.tpl .mini{width:54px;height:70px;border-radius:6px;background:#fff;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tpl .mini b{position:absolute;display:block}
.swrow{display:flex;flex-direction:column;gap:8px}
.swrow span{font-size:14px;color:var(--muted);font-weight:600}
.sws{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.sw.custom{position:relative;overflow:hidden;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.actions .wide{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.on{opacity:1}
.confirm{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.sheet-wrap{border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(20,35,90,.16);background:var(--surface)}
.sheet:not([src]){aspect-ratio:1240/1754}
.sheet{display:block;width:100%;height:auto}

/* reports */
.mnav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:12px}
.mnav b{font:800 17px var(--f-display)}
.mnav button{border:0;background:var(--soft);border-radius:12px;width:40px;height:40px;font-size:20px;font-weight:800}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow)}
.kpi small{color:var(--muted);font-weight:600;font-size:13px}
.kpi b{display:block;font:800 20px var(--f-display);margin-top:3px}
.kpi.main{grid-column:1/-1;background:linear-gradient(140deg,#1b2f6e,#2c4aa8);color:#fff;border:0}
.kpi.main small{color:rgba(255,255,255,.8)}
.kpi.main b{color:#f3d77a;font-size:28px}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:14px 14px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:color-mix(in srgb,var(--accent) 30%,transparent);min-height:4px}
.bar.cur i{background:linear-gradient(180deg,var(--gold),#b8901c)}
.bar span{font-size:12px;color:var(--muted);font-weight:600;padding-bottom:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.panel h3{font-size:16px;padding:14px 16px 0}
.trow{display:flex;justify-content:space-between;gap:10px;padding:11px 16px;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow b{font-weight:700}

/* more */
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.mi2{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:right;width:100%;font-weight:700}
.mi2:first-child{border-top:0}
.mi2 .mic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--soft);font-size:18px;flex:0 0 auto}
.mi2 span{flex:1}
.mi2 small{display:block;color:var(--muted);font-weight:500;font-size:14.5px}
.switch{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--ok)}
.switch.on::after{right:23px}

.credits{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;padding:12px 10px 24px;border-top:1px solid var(--line);margin-top:6px}
.credits b{color:var(--fg);font-weight:700}
.credits a{color:var(--accent);font-weight:700;text-decoration:none}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11.5px;font-weight:700}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.3}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  :root,body{background:#fff!important;padding:0}
  .app{max-width:none;padding:0}
  .app>*:not(.sheet-wrap),.tabbar{display:none!important}
  .sheet-wrap{box-shadow:none;border-radius:0}
  .toast{display:none}
}
/* فاتورتي برو */
.procard{position:relative;overflow:hidden;border-radius:22px;padding:18px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#1b2f6e,#2c4aa8 60%,#3a5bd0);box-shadow:0 10px 30px rgba(27,47,110,.3);border:0;width:100%;text-align:right;display:block}
.procard::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;left:-60px;top:-70px;background:radial-gradient(circle,rgba(227,187,74,.45),transparent 70%)}
.procard b{font:800 20px var(--f-display);display:flex;align-items:center;gap:8px}
.procard small{display:block;opacity:.9;font-weight:500;margin-top:4px;font-size:15px}
.procard .go{display:inline-block;margin-top:12px;background:var(--gold);color:#1b2f6e;font-weight:800;padding:9px 16px;border-radius:999px;font-size:14px}
.crown{display:inline-grid;place-items:center;background:var(--gold);color:#1b2f6e;border-radius:8px;font:800 11px var(--f-body);padding:2px 7px;margin-inline-start:6px;vertical-align:middle}
.pw h1{text-align:center;font-size:30px;margin-top:6px}
.pw .hero{text-align:center;font-size:58px;margin-top:8px}
.pw p.sub{text-align:center;color:var(--muted);margin:6px 0 18px;font-size:17px}

async function nativeShare(blob,name,title){

}

const HAS_AR=/[؀-ۿ]/;
function trText(s){
  if(LANG!=='en'||!s||!HAS_AR.test(s))return s;
  const lead=s.match(/^\s*/)[0],tail=s.match(/\s*$/)[0],t=s.trim();
  if(I18N[t]!=null)return lead+I18N[t]+tail;
  for(const [rx,f] of I18N_RX){const m=t.match(rx);if(m)return lead+f(m)+tail}
  return s;
}
let i18nBusy=false;
function trTree(root){
  if(LANG!=='en'||!root)return;i18nBusy=true;

  while(n=w.nextNode()){const v=n.nodeValue;if(!HAS_AR.test(v)){if(v.trim()==='‹'&&!n.parentElement.closest('.mnav'))n.nodeValue=v.replace('‹','›');continue}const r=trText(v);if(r!==v)n.nodeValue=r}
  const els=root.nodeType===1?[root,...root.querySelectorAll('[placeholder],[aria-label],[alt],[title]')]:[];
  els.forEach(e=>['placeholder','aria-label','alt','title'].forEach(a=>{const v=e.getAttribute&&e.getAttribute(a);if(v&&HAS_AR.test(v)){const r=trText(v);if(r!==v)e.setAttribute(a,r)}}));
  i18nBusy=false;
}

   moveTo:(a,b)=>x.moveTo(mx(a),b),lineTo:(a,b)=>x.lineTo(mx(a),b),
   arc:(a,b,r,s,e,ccw)=>x.arc(mx(a),b,r,Math.PI-e,Math.PI-s,!!ccw),
   arcTo:(a,b,c,d,r)=>x.arcTo(mx(a),b,mx(c),d,r),

   drawImage:(im,...r)=>{if(r.length===2)return x.drawImage(im,mx(r[0])-im.width,r[1]);if(r.length===4)return x.drawImage(im,mx(r[0])-r[2],r[1],r[2],r[3]);return x.drawImage(im,r[0],r[1],r[2],r[3],mx(r[4])-r[6],r[5],r[6],r[7])},

     ${S.products.length?`<div class="qchips">${S.products.map(p=>`<button class="qchip" data-prod="${p.id}">+ ${esc(p.name)}<small class="num">${money(p.price)}</small></button>`).join('')}</div>`:''}
     <div id="items">${cur.items.map((it,k)=>`<div class="item">
     <label class="descl"><span>الوصف</span><input class="in desc" data-k="${k}" data-f="d" list="dlp" value="${esc(it.d)}" placeholder="مثال: صيانة مكيف" autocomplete="off"></label>
     <label><span>الكمية</span><input class="in num" data-k="${k}" data-f="q" type="number" inputmode="decimal" step="any" value="${it.q}" placeholder="1"></label>
     <label><span>سعر الوحدة</span><input class="in num" data-k="${k}" data-f="p" type="number" inputmode="decimal" step="any" value="${it.p||''}" placeholder="0"></label>
     <label class="amt"><span>المبلغ</span><input class="in num" data-k="${k}" data-f="a" type="number" inputmode="decimal" step="any" value="${(+it.q||0)*(+it.p||0)?+((+it.q||0)*(+it.p||0)).toFixed(3):''}" placeholder="0"></label>
     <button class="del" data-del="${k}" aria-label="حذف البند">×</button></div>`).join('')}</div>
     <datalist id="dlp">${S.products.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
     <button class="add" id="additem">+ إضافة بند</button></div>
   <div class="sec"><h3>الخصم والضريبة</h3><div class="grid2">
     <label class="f">خصم (مبلغ)<input class="in num" id="disc" type="number" step="any" inputmode="decimal" value="${cur.disc||''}" placeholder="0"></label>
     <label class="f">العربون (مدفوع مقدمًا)<input class="in num" id="dep" type="number" step="any" inputmode="decimal" value="${cur.dep||''}" placeholder="0"></label>
     <label class="f">ضريبة القيمة المضافة<select class="in" id="vat"><option value="0" ${!cur.vat?'selected':''}>بدون</option><option value="1" ${cur.vat?'selected':''}>5%</option></select></label>
     ${q?'':`<label class="f">الحالة<select class="in" id="status"><option value="due" ${cur.status!=='paid'?'selected':''}>مستحقة</option><option value="paid" ${cur.status==='paid'?'selected':''}>مدفوعة</option></select></label>`}</div></div>
   <div class="sec"><label class="f">ملاحظات<textarea class="in" id="notes" rows="2" placeholder="${q?'مثال: الأسعار تشمل التركيب':'مثال: التحويل على حساب بنك مسقط'}">${esc(cur.notes)}</textarea></label></div>
   <div class="totals" id="totals"></div>
   ${cur._new?'':`<div style="margin-top:14px">${confirmDel?`<div class="confirm"><p style="margin:0 0 10px">حذف ${docName(cur)} #${docNo(cur)} نهائياً؟</p><div class="row"><button class="btn danger" id="edYes">نعم، احذف</button><button class="btn ghost" id="edNo">إلغاء</button></div></div>`:`<button class="btn ghost" id="edDel" style="width:100%;color:var(--late)">🗑️ حذف ${q?'العرض':'الفاتورة'}</button>`}</div>`}
   <div class="fab solo"><button class="btn" id="saveinv" style="width:100%">حفظ ومعاينة</button></div>`;
  const upd=()=>{const t=calc(cur),ex=t.disc||cur.vat;$('#totals').innerHTML=`${ex?`<div><span>المجموع</span><span class="num">${money(t.sub)}</span></div>`:''}${t.disc?`<div><span>الخصم</span><span class="num">- ${money(t.disc)}</span></div>`:''}${cur.vat?`<div><span>الضريبة 5%</span><span class="num">${money(t.vat)}</span></div>`:''}${t.dep?`<div><span>العربون</span><span class="num">${money(t.dep)}</span></div><div><span>المتبقي</span><b class="num" style="color:var(--late)">${money(t.rem)}</b></div>`:''}<div class="g"><span>الإجمالي</span><span class="num">${money(t.total)}</span></div>`};
  upd();
  ['client','cphone','caddr','date','due','notes'].forEach(id=>$('#'+id).oninput=e=>cur[id]=e.target.value);
  const fillClient=c=>{cur.client=c.name;if(c.phone)cur.cphone=c.phone;if(c.addr)cur.caddr=c.addr;renderEdit()};
  $('#client').onchange=e=>{const c=S.clients.find(c=>c.name===e.target.value.trim());if(c)fillClient(c)};
  $$('[data-cl]').forEach(b=>b.onclick=()=>fillClient(S.clients.find(c=>c.id===b.dataset.cl)));
  $('#disc').oninput=e=>{cur.disc=+e.target.value||0;upd()};
  $('#dep').oninput=e=>{cur.dep=+e.target.value||0;upd()};
  $('#vat').onchange=e=>{cur.vat=e.target.value==='1';upd()};
  $('#status')&&($('#status').onchange=e=>cur.status=e.target.value);
  const fld=(k,f)=>document.querySelector(`#items [data-k="${k}"][data-f="${f}"]`);
  $$('#items input').forEach(i=>i.oninput=()=>{const k=i.dataset.k,f=i.dataset.f,it=cur.items[k];
    if(f==='d')it.d=i.value;
    else if(f==='a'){const q=+it.q||1;if(!(+it.q))it.q=1;it.p=+((+i.value||0)/q).toFixed(3);fld(k,'p').value=it.p||'';fld(k,'q').value=it.q}
    else{it[f]=+i.value||0;const a=(+it.q||0)*(+it.p||0);fld(k,'a').value=a?+a.toFixed(3):''}
    upd()});
  $$('#items .desc').forEach(i=>i.onchange=()=>{const it=cur.items[i.dataset.k],p=S.products.find(p=>p.name===i.value.trim());if(p&&!(+it.p)){it.p=p.price;renderEdit()}});
  $$('[data-prod]').forEach(b=>b.onclick=()=>{const p=S.products.find(p=>p.id===b.dataset.prod);const last=cur.items[cur.items.length-1];
    if(last&&!last.d.trim()&&!(+last.p)){last.d=p.name;last.p=p.price;last.q=last.q||1}else{const ex=cur.items.find(it=>it.d===p.name);if(ex)ex.q=(+ex.q||0)+1;else cur.items.push({d:p.name,q:1,p:p.price})}renderEdit()});
  $$('[data-del]').forEach(b=>b.onclick=()=>{cur.items.splice(+b.dataset.del,1);if(!cur.items.length)cur.items.push({d:'',q:1,p:0});renderEdit()});
  $('#edDel')&&($('#edDel').onclick=()=>{confirmDel=true;const y=scrollY;renderEdit();scrollTo(0,y)});
  $('#edNo')&&($('#edNo').onclick=()=>{confirmDel=false;const y=scrollY;renderEdit();scrollTo(0,y)});
  $('#edYes')&&($('#edYes').onclick=()=>{S.invoices=S.invoices.filter(x=>x.id!==cur.id);save();confirmDel=false;toast('تم الحذف');view=cur._back||'home';render()});
  $('#additem').onclick=()=>{cur.items.push({d:'',q:1,p:0});renderEdit();const d=$$('.desc');d[d.length-1].focus()};
  $('#cancel').onclick=()=>{if(cur._new){view=cur._from||'home'}else{view='view';cur=JSON.parse(JSON.stringify(S.invoices.find(i=>i.id===cur.id)))}render()};
  $('#saveinv').onclick=()=>{
    cur.items=cur.items.filter(i=>i.d.trim()||i.p);if(!cur.items.length){toast('أضف بنداً واحداً على الأقل');cur.items=[{d:'',q:1,p:0}];return}
    const back=cur._from==='client'?'client':cur._back,isNew=cur._new;delete cur.sample;
    const clean=JSON.parse(JSON.stringify(cur));['_new','_from','_back','_backC'].forEach(k=>delete clean[k]);
    if(isNew){if(isQ(clean))S.qseq++;else S.seq++;S.invoices.push(clean)}else S.invoices[S.invoices.findIndex(i=>i.id===clean.id)]=clean;
    cur=JSON.parse(JSON.stringify(clean));if(back)cur._back=back;
    upsertClient(cur);upsertProducts(cur);
    save();toast('تم الحفظ');view='view';render()};
}

const PAPERS=[['#ffffff','أبيض'],['#ece2d4','بيج'],['#fbf6ec','كريمي'],['#f1e6d2','رملي'],['#eef4f1','نعناعي'],['#edf2f8','سماوي'],['#f8eef0','وردي'],['#1c1d22','فحمي']];
const ACCENTS=[['#16161a','أسود'],['#5a1f1f','خمري'],['#8a6a45','بني'],['#1d3557','كحلي'],['#1b2f6e','ملكي'],['#b08d3c','ذهبي'],['#1f7a5a','زمردي'],['#7a1f2b','عنابي'],['#0f7c86','فيروزي'],['#c2562c','برتقالي']];
const TDEF={luxe:['#ece2d4','#5a1f1f'],ornate:['#ffffff','#8a6a45']};
const TPLS=[
 ['luxe','فاخر',a=>`<b style="top:0;right:4px;width:22px;height:22px;background:${a}"></b><b style="top:25px;right:4px;width:22px;height:9px;background:${a}"></b><b style="top:40px;left:4px;right:4px;height:6px;background:${a}"></b><b style="bottom:0;left:0;width:28px;height:9px;background:${a}"></b>`],
 ['ornate','مزخرف',a=>`<b style="inset:4px;border:1.5px solid ${a}"></b><b style="top:10px;left:14px;right:14px;height:6px;background:${a};border-radius:2px"></b><b style="top:27px;left:8px;right:8px;height:5px;background:${a}"></b>`],
 ['classic','كلاسيك',a=>`<b style="top:12px;left:6px;right:6px;height:2px;background:${a}"></b>`],
 ['band','شريط',a=>`<b style="top:0;left:0;right:0;height:18px;background:${a}"></b><b style="bottom:0;left:0;right:0;height:3px;background:${a}"></b>`],
 ['omani','عماني',a=>`<b style="inset:4px;border:1.5px solid ${a};border-radius:3px"></b>`],
 ['curve','دوائر',a=>`<b style="width:40px;height:40px;border-radius:50%;background:${a};left:-16px;bottom:-18px"></b><b style="width:22px;height:22px;border-radius:50%;background:${a};opacity:.35;left:-6px;top:-8px"></b>`],
 ['minimal','بسيط',a=>`<b style="top:8px;left:6px;width:26px;height:7px;background:${a};border-radius:2px"></b><b style="top:30px;left:6px;right:6px;height:5px;background:${a};opacity:.15"></b><b style="top:42px;left:6px;right:6px;height:5px;background:${a};opacity:.15"></b>`]];
function design(){return {tpl:'luxe',paper:'#ece2d4',accent:'#5a1f1f',...(S.biz.design||{})}}
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const lum=h=>{const [r,g,b]=hx(h);return (0.299*r+0.587*g+0.114*b)/255};
function paperVars(){
  const d=design(),dark=lum(d.paper)<0.4;
  const ink=dark?'#f2f2f4':'#16161a';
  let acc=d.accent; if(dark&&lum(acc)<0.25)acc=mix(acc,'#ffffff',0.7);
  const pc=lum(acc)>0.6?'#16161a':'#ffffff';
  return `--pp:${d.paper};--pi:${ink};--pa:${acc};--pc:${pc};--pm:${mix(ink,d.paper,0.45)};--pl:${mix(ink,d.paper,0.86)};--ps:${mix(acc,d.paper,0.9)};--pt:${mix(acc,d.paper,0.6)}`;
}

/* ---------- invoice view ---------- */
function invText(i){if(invEN()){CTXLANG='en';try{return invTextEn(i)}finally{CTXLANG=null}}return invTextAr(i)}
function remindText(i){if(invEN()){CTXLANG='en';try{return remindTextEn(i)}finally{CTXLANG=null}}return remindTextAr(i)}
function invTextEn(i){const t=calc(i),b=S.biz,q=isQ(i);let s=`*${b.name}*\n${q?'Quote':'Invoice'} #${docNo(i)}\nDate: ${i.date}${i.due?`\n${q?'Valid until':'Due date'}: ${i.due}`:''}\nClient: ${i.client}\n\n`;
  i.items.forEach(it=>s+=`• ${it.d} × ${it.q} = ${money(it.q*it.p)}\n`);
  s+=`${t.disc||i.vat?`\nSubtotal: ${money(t.sub)}`:''}${t.disc?`\nDiscount: ${money(t.disc)}`:''}${i.vat?`\nVAT 5%: ${money(t.vat)}`:''}\n*Total: ${money(t.total)}*${t.dep?`\nDeposit: ${money(t.dep)}\n*Balance due: ${money(t.rem)}*`:''}${q?'':`\nStatus: ${i.status==='paid'?'Paid':'Due'}`}${i.notes?`\n\n${i.notes}`:''}${b.phone?`\n📞 ${b.phone}`:''}`;return s}
function remindTextEn(i){const b=S.biz;const pl={'البنك':'Bank','اسم الحساب':'Account name','رقم الحساب':'Account no.'};return `Hello ${i.client||''},\nThis is a friendly reminder about invoice #${docNo(i)} dated ${i.date} for *${money(calc(i).rem)}*${overdue(i)?`, which is ${daysLate(i)} days past due`:''}.\n${payRows(b).length?'\nPayment details:\n'+payRows(b).map(([l,v])=>`${pl[l]||l}: ${v}`).join('\n')+'\n':''}\nThank you 🌹\n${b.name}${b.phone?' · '+b.phone:''}`}
function invTextAr(i){const t=calc(i),b=S.biz,q=isQ(i);let s=`*${b.name}*\n${q?'عرض سعر':'فاتورة'} رقم #${docNo(i)}\nالتاريخ: ${i.date}${i.due?`\n${q?'صالح حتى':'الاستحقاق'}: ${i.due}`:''}\nالعميل: ${i.client}\n\n`;
  i.items.forEach(it=>s+=`• ${it.d} × ${it.q} = ${money(it.q*it.p)}\n`);
  s+=`${t.disc||i.vat?`\nالمجموع: ${money(t.sub)}`:''}${t.disc?`\nالخصم: ${money(t.disc)}`:''}${i.vat?`\nالضريبة 5%: ${money(t.vat)}`:''}\n*الإجمالي: ${money(t.total)}*${t.dep?`\nالعربون: ${money(t.dep)}\n*المتبقي: ${money(t.rem)}*`:''}${q?'':`\nالحالة: ${i.status==='paid'?'مدفوعة':'مستحقة'}`}${i.notes?`\n\n${i.notes}`:''}${b.phone?`\n📞 ${b.phone}`:''}`;return s}
function remindTextAr(i){const b=S.biz;return `السلام عليكم ${i.client||''}،\nنذكّركم بلطف بالفاتورة رقم #${docNo(i)} بتاريخ ${i.date} بمبلغ *${money(calc(i).rem)}*${overdue(i)?`، وقد مضى على موعد استحقاقها ${daysLate(i)} يوم`:''}.\n${payRows(b).length?'\nبيانات التحويل:\n'+payRows(b).map(([l,v])=>`${l}: ${v}`).join('\n')+'\n':''}\nشاكرين تعاونكم 🌹\n${b.name}${b.phone?' · '+b.phone:''}`}

   ${q?`<span class="doclabel">📝 عرض سعر${i.converted?' · تحوّل لفاتورة':''}</span>`:overdue(i)?`<span class="doclabel" style="background:color-mix(in srgb,var(--late) 14%,transparent);color:var(--late)">⏰ متأخرة ${daysLate(i)} يوم</span>`:''}

    <div class="swrow"><span>لون الورق</span><div class="sws">${PAPERS.map(([c,n])=>`<button class="sw" data-paper="${c}" style="background:${c}" aria-label="${n}" aria-pressed="${design().paper===c}"></button>`).join('')}</div></div>
    <div class="swrow"><span>اللون الرئيسي</span><div class="sws">${ACCENTS.map(([c,n])=>`<button class="sw" data-accent="${c}" style="background:${c}" aria-label="${n}" aria-pressed="${design().accent===c}"></button>`).join('')}<label class="sw custom" aria-label="لون مخصص"><input type="color" id="pick" value="${design().accent}"></label></div></div>
   </div>`;
  $('#back').onclick=()=>{confirmDel=false;view=cur._back||'home';render()};

  $('#toggle')&&($('#toggle').onclick=()=>{i.status=i.status==='paid'?'due':'paid';persist(i);toast(i.status==='paid'?'تم تعيينها مدفوعة ✓':'تم تعيينها مستحقة');renderView()});
  $('#convert')&&($('#convert').onclick=()=>{

    i.converted=true;persist(i);S.invoices.push(inv);save();cur=JSON.parse(JSON.stringify(inv));toast('تم إنشاء فاتورة #'+docNo(inv));renderView()});
  $('#dup').onclick=()=>{const d={...JSON.parse(JSON.stringify(i)),id:'i'+Date.now(),no:q?S.qseq:S.seq,date:today(),due:'',status:'due',_new:true};delete d.converted;delete d.sample;delete d.fromQuote;cur=d;view='edit';render()};
  $('#del').onclick=()=>{confirmDel=true;renderView()};
  $('#print')&&($('#print').onclick=()=>window.print());
  $('#pdf').onclick=()=>sharePdf(i);
  const setD=(k,v)=>{S.biz.design={...design(),[k]:v};save();const y=scrollY;renderView();scrollTo(0,y)};
  $$('[data-tpl]').forEach(e=>e.onclick=()=>{const k=e.dataset.tpl,df=TDEF[k];S.biz.design={...design(),tpl:k,...(df?{paper:df[0],accent:df[1]}:{})};save();const y=scrollY;renderView();scrollTo(0,y)});
  $$('[data-il]').forEach(e=>e.onclick=()=>{S.biz.invLang=e.dataset.il;save();const y=scrollY;renderView();scrollTo(0,y)});
  $$('[data-paper]').forEach(e=>e.onclick=()=>setD('paper',e.dataset.paper));
  $$('[data-accent]').forEach(e=>e.onclick=()=>setD('accent',e.dataset.accent));
  $('#pick').onchange=e=>setD('accent',e.target.value);

  $('#no')&&($('#no').onclick=()=>{confirmDel=false;renderView()});
  $('#yes')&&($('#yes').onclick=()=>{S.invoices=S.invoices.filter(x=>x.id!==i.id);save();confirmDel=false;toast('تم الحذف');view=cur._back||'home';render()});
}
function persist(i){const k=S.invoices.findIndex(x=>x.id===i.id);const c=JSON.parse(JSON.stringify(i));delete c._back;if(k>=0)S.invoices[k]=c;save()}

const monthName=m=>{const [y,mm]=m.split('-');return (EN()?MONTHS_EN:MONTHS)[+mm-1]+' '+y};
const shiftMonth=(m,d)=>{let [y,mm]=m.split('-').map(Number);mm+=d;while(mm<1){mm+=12;y--}while(mm>12){mm-=12;y++}return y+'-'+String(mm).padStart(2,'0')};
function monthStats(m){
  const invs=S.invoices.filter(i=>!isQ(i)&&!i.sample&&(i.date||'').startsWith(m));
  const T=invs.map(calc);
  return {n:invs.length,sales:T.reduce((a,t)=>a+t.total,0),vat:T.reduce((a,t)=>a+t.vat,0),
    paid:invs.filter(i=>i.status==='paid').reduce((a,i)=>a+calc(i).total,0),
    unpaid:invs.filter(i=>i.status!=='paid').reduce((a,i)=>a+owed(i),0),
    quotes:S.invoices.filter(i=>isQ(i)&&(i.date||'').startsWith(m)).length,invs};
}

/* ---------- invoice drawing: one renderer for the preview and the PDF ---------- */
function pv(){const o={};paperVars().split(';').forEach(s=>{const [k,v]=s.split(':');o[k.trim()]=v.trim()});return o}
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src})}
const DF='"FCairo",system-ui,sans-serif',BF='"FTajawal",system-ui,sans-serif';
const isAr=s=>/[؀-ۿ]/.test(String(s));
/* body text a little larger for readability; big titles stay as designed */
const UP=z=>z<=36?Math.round(z*1.14):z;
function kit(x,c){
  const T=(s,px,py,{size=28,w=500,col=c['--pi'],al='right',f=BF,dir}={})=>{s=IL(s);if(CTXLANG==='en')dir=null;x.font=`${w} ${UP(size)}px ${f}`;x.fillStyle=col;x.textAlign=al;x.direction=dir||(isAr(s)?'rtl':'ltr');x.textBaseline='alphabetic';x.fillText(String(s),px,py)};
  const M=(s,size,w=500,f=BF)=>{x.font=`${w} ${UP(size)}px ${f}`;return x.measureText(String(s)).width};
  const fit=(s,maxW,size,w=500)=>{s=String(s);if(M(s,size,w)<=maxW)return s;while(s.length>2&&M(s+'…',size,w)>maxW)s=s.slice(0,-1);return s+'…'};
  const wrap=(s,maxW,size,w=400,f=BF)=>{const out=[];String(s||'').split('\n').forEach(par=>{let line='';par.split(/\s+/).filter(Boolean).forEach(word=>{const t=line?line+' '+word:word;if(M(t,size,w,f)>maxW&&line){out.push(line);line=word}else line=t});if(line)out.push(line)});return out};
  const box=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(a,b,w,h)};
  const frame=(a,b,w,h,col,lw)=>{x.strokeStyle=col;x.lineWidth=lw;x.strokeRect(a,b,w,h)};
  const hl=(a,b,w,col,lw)=>{x.fillStyle=col;x.fillRect(a,b-lw/2,w,lw)};
  const vl=(a,b,h,col,lw)=>{x.fillStyle=col;x.fillRect(a-lw/2,b,lw,h)};
  const dia=(cx,cy,s,col,mode='fill',lw=4,back)=>{x.save();x.translate(cx,cy);x.rotate(Math.PI/4);if(back){x.fillStyle=back;x.fillRect(-s/2,-s/2,s,s)}if(mode==='fill'){x.fillStyle=col;x.fillRect(-s/2,-s/2,s,s)}else{x.strokeStyle=col;x.lineWidth=lw;x.strokeRect(-s/2,-s/2,s,s)}x.restore()};
  // "label : value" with the label on the right, value to its left (right-anchored)
  const kv=(label,value,xr,y,o={})=>{const lt=IL(label)+(CTXLANG==='en'?':':' :');T(lt,xr,y,o);T(value,xr-M(lt,o.size||28,o.w||500)-14,y,{...o,al:'right'})};
  // same, anchored on the left edge: value first, label after it
  const kvL=(label,value,xl,y,o={})=>{T(value,xl,y,{...o,al:'left'});T(IL(label)+(CTXLANG==='en'?':':' :'),xl+M(value,o.size||28,o.w||500)+14,y,{...o,al:'left',dir:'rtl'})};

  const xref=len;let x=`xref\n0 6\n0000000000 65535 f \n`;for(let n=1;n<=5;n++)x+=String(off[n]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  const s=parts.join('');const u=new Uint8Array(s.length);for(let k=0;k<s.length;k++)u[k]=s.charCodeAt(k)&255;
  return new Blob([u],{type:'application/pdf'});
}

const LN=()=>NATIVE&&Capacitor.Plugins.LocalNotifications;
async function askNotif(){const L=LN();if(!L)return false;try{let p=await L.checkPermissions();if(p.display!=='granted')p=await L.requestPermissions();return p.display==='granted'}catch(e){return false}}

const nid=(s,k)=>{let h=k*7919;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)%2000000000};
const at9=(d,add)=>{const t=new Date(d+'T09:00:00');t.setDate(t.getDate()+(add||0));return t};
let nTimer;
function scheduleNotifs(){clearTimeout(nTimer);nTimer=setTimeout(async()=>{
  const L=LN();if(!L||!isPro()||!proOpt('notif')||!S.biz)return;
  try{if((await L.checkPermissions()).display!=='granted')return}catch(e){return}
  await cancelNotifs();const now=Date.now(),list=[];
  S.invoices.filter(i=>!i.sample&&i.due&&i.status!=='paid').forEach(i=>{
    const E=EN(),who=i.client||(E?'a client':'عميل');
    if(isQ(i)){const t=at9(i.due,-1);if(t>now)list.push({id:nid(i.id,1),title:E?'Quote expires tomorrow ⏳':'عرض سعر ينتهي بكرة ⏳',body:E?`Quote #${docNo(i)} for ${who} is valid until ${i.due}`:`عرض السعر #${docNo(i)} لـ ${who} صالح لين ${i.due}`,schedule:{at:t}});return}
    const amt=money(calc(i).rem);
    (E?[[0,'Invoice due today 🧾',`Invoice #${docNo(i)} for ${who} (${amt}) is due today`],[3,'Invoice overdue ⚠️',`Invoice #${docNo(i)} for ${who} (${amt}) is 3 days late — remind them on WhatsApp`],[7,'Invoice a week overdue ⚠️',`Invoice #${docNo(i)} for ${who} (${amt}) is still unpaid`]]:[[0,'فاتورة مستحقة اليوم 🧾',`الفاتورة #${docNo(i)} لـ ${i.client||'عميل'} بمبلغ ${amt} مستحقة اليوم`],
     [3,'فاتورة متأخرة ⚠️',`الفاتورة #${docNo(i)} لـ ${i.client||'عميل'} (${amt}) متأخرة 3 أيام — ذكّره بالواتساب`],
     [7,'فاتورة متأخرة أسبوع ⚠️',`الفاتورة #${docNo(i)} لـ ${i.client||'عميل'} (${amt}) ما انسددت للحين`]]).forEach(([d,t,b],k)=>{const w=at9(i.due,d);if(w>now)list.push({id:nid(i.id,k+2),title:t,body:b,schedule:{at:w},extra:{inv:i.id}})});
  });
  list.sort((a,b)=>a.schedule.at-b.schedule.at);
  try{if(list.length)await L.schedule({notifications:list.slice(0,60)})}catch(e){}
},1500)}

  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);last=pt(e)};
  cv.onpointermove=e=>{if(!last)return;const p=pt(e);x.beginPath();x.moveTo(...last);x.lineTo(...p);x.stroke();last=p;drawn=true};
  cv.onpointerup=cv.onpointercancel=()=>{last=null};
  $('#sgClr').onclick=()=>{x.clearRect(0,0,cv.width,cv.height);drawn=false};
  $('#sgSave').onclick=()=>{if(!drawn)return toast('وقّع في المربع أول');S.biz.sig=trimSig(cv);S.biz.sigOff=false;save();toast('تم حفظ التوقيع ✓');renderSig()};
  $('#sgFile').onchange=e=>readLogo(e.target.files[0],u=>{S.biz.sig=u;S.biz.sigOff=false;save();toast('تم حفظ الختم ✓');renderSig()});
  $('#sgShow')&&($('#sgShow').onchange=e=>{S.biz.sigOff=!e.target.checked;save()});
  $('#sgDel')&&($('#sgDel').onclick=()=>{S.biz.sig='';save();toast('تم الحذف');renderSig()});
  $('#sgBack').onclick=()=>{view='more';render()};
}
function trimSig(cv){const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;let a=cv.width,b=cv.height,c=0,e=0;
  for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++)if(d[(y*cv.width+x)*4+3]>10){if(x<a)a=x;if(x>c)c=x;if(y<b)b=y;if(y>e)e=y}
  const p=12;a=Math.max(0,a-p);b=Math.max(0,b-p);c=Math.min(cv.width,c+p);e=Math.min(cv.height,e+p);
  const o=document.createElement('canvas');o.width=c-a;o.height=e-b;o.getContext('2d').drawImage(cv,a,b,c-a,e-b,0,0,c-a,e-b);return o.toDataURL('image/png')}
let BOT=0,SIGAT=null;
function drawSig(x,c,H,im){if(!im)return;
  const L=110,maxW=330,maxH=150,s=Math.min(maxW/im.width,maxH/im.height,1.6),w=im.width*s,h=im.height*s;
  if(SIGAT){const s2=Math.min(SIGAT.w/im.width,140/im.height,1.6),w2=im.width*s2,h2=im.height*s2;x.drawImage(im,SIGAT.x+(SIGAT.w-w2)/2,SIGAT.base-h2,w2,h2);return}
  const base=Math.min(BOT||H-120,H-120)-40;
  x.drawImage(im,L+(maxW-w)/2,base-h-50,w,h);
  x.fillStyle=c['--pm'];x.fillRect(L,base-36,maxW,2);
  x.font=`600 26px ${BF}`;x.fillStyle=c['--pm'];x.textAlign='center';x.direction=CTXLANG==='en'?'ltr':'rtl';x.fillText(IL('التوقيع / الختم'),L+maxW/2,base);
}

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
let lastTab=null;
function render(){
  if(TABS.some(t=>t[0]===view)&&view!==lastTab){search='';editP=null;lastTab=view}
  ({ob:renderOb,home:renderHome,edit:renderEdit,view:renderView,clients:renderClients,client:renderClient,products:renderProducts,reports:renderReports,more:renderMore,pro:renderPro,sig:renderSig})[view]();
  tabbar();window.scrollTo(0,0)}
initPro();if(isPro()){scheduleNotifs();autoBackup()}
render();
</script>
